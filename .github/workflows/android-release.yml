name: Android release

on:
  workflow_dispatch:
  push:
    tags: ["android-v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NYTD_ANDROID_STORE_PASSWORD: ${{ secrets.NYTD_ANDROID_STORE_PASSWORD }}
      NYTD_ANDROID_KEY_ALIAS: ${{ secrets.NYTD_ANDROID_KEY_ALIAS }}
      NYTD_ANDROID_KEY_PASSWORD: ${{ secrets.NYTD_ANDROID_KEY_PASSWORD }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          java-package: jdk
          check-latest: false
          cache: gradle

      - name: Install Android SDK 36
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - name: Restore release keystore
        env:
          NYTD_ANDROID_KEYSTORE_BASE64: ${{ secrets.NYTD_ANDROID_KEYSTORE_BASE64 }}
        run: |
          test -n "$NYTD_ANDROID_KEYSTORE_BASE64"
          test -n "$NYTD_ANDROID_STORE_PASSWORD"
          test -n "$NYTD_ANDROID_KEY_ALIAS"
          test -n "$NYTD_ANDROID_KEY_PASSWORD"
          printf '%s' "$NYTD_ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/nytweetdeck-release.keystore"
          chmod 600 "$RUNNER_TEMP/nytweetdeck-release.keystore"
          echo "NYTD_ANDROID_KEYSTORE=$RUNNER_TEMP/nytweetdeck-release.keystore" >> "$GITHUB_ENV"

      - name: Verify and build signed release
        working-directory: android
        run: >-
          ./gradlew --no-daemon clean
          :app:testDebugUnitTest
          :app:lintRelease
          :app:assembleRelease

      - name: Verify signature and checksum
        working-directory: android
        run: |
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs app/build/outputs/apk/release/app-release.apk
          sha256sum app/build/outputs/apk/release/app-release.apk > app/build/outputs/apk/release/app-release.apk.sha256

      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: NyTweetDeck-Android-${{ github.ref_name }}
          path: |
            android/app/build/outputs/apk/release/app-release.apk
            android/app/build/outputs/apk/release/app-release.apk.sha256
          if-no-files-found: error

      - name: Publish tagged GitHub release
        if: startsWith(github.ref, 'refs/tags/android-v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --generate-notes
          gh release upload "$GITHUB_REF_NAME" android/app/build/outputs/apk/release/app-release.apk android/app/build/outputs/apk/release/app-release.apk.sha256 --clobber
