name: Android release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing android-v-prefixed release tag
        required: true
        type: string
  push:
    tags: ["android-v*"]

permissions:
  contents: write

env:
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NYTD_ANDROID_STORE_PASSWORD: ${{ secrets.NYTD_ANDROID_STORE_PASSWORD }}
      NYTD_ANDROID_KEY_ALIAS: ${{ secrets.NYTD_ANDROID_KEY_ALIAS }}
      NYTD_ANDROID_KEY_PASSWORD: ${{ secrets.NYTD_ANDROID_KEY_PASSWORD }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ env.RELEASE_TAG }}
          fetch-depth: 0

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          java-package: jdk
          check-latest: false
          cache: gradle

      - name: Install Android SDK 36
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - name: Restore release keystore
        env:
          NYTD_ANDROID_KEYSTORE_BASE64: ${{ secrets.NYTD_ANDROID_KEYSTORE_BASE64 }}
        run: |
          test -n "$NYTD_ANDROID_KEYSTORE_BASE64"
          test -n "$NYTD_ANDROID_STORE_PASSWORD"
          test -n "$NYTD_ANDROID_KEY_ALIAS"
          test -n "$NYTD_ANDROID_KEY_PASSWORD"
          printf '%s' "$NYTD_ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/nytweetdeck-release.keystore"
          chmod 600 "$RUNNER_TEMP/nytweetdeck-release.keystore"
          echo "NYTD_ANDROID_KEYSTORE=$RUNNER_TEMP/nytweetdeck-release.keystore" >> "$GITHUB_ENV"

      - name: Validate release tag, source branch, and application version
        shell: bash
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^android-v([0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?)$ ]]; then
            echo "Androidリリースタグはandroid-vから始まるSemVerで指定してください。" >&2
            exit 1
          fi
          version="${RELEASE_TAG#android-v}"
          configured_version="$(sed -n 's/.*versionName = "\([^"]*\)".*/\1/p' android/app/build.gradle.kts)"
          if [[ "$configured_version" != "$version" ]]; then
            echo "タグ $version とAndroid versionName $configured_version が一致しません。" >&2
            exit 1
          fi
          git fetch origin main
          git merge-base --is-ancestor "$(git rev-parse HEAD)" origin/main
          echo "RELEASE_VERSION=$version" >> "$GITHUB_ENV"

      - name: Audit Android dependencies
        shell: pwsh
        run: ./scripts/audit-gradle.ps1

      - name: Verify and build signed release
        working-directory: android
        run: >-
          ./gradlew --no-daemon clean
          :app:testDebugUnitTest
          :app:lintRelease
          :app:assembleRelease

      - name: Verify signature and checksum
        shell: bash
        run: |
          release_dir="android/app/build/outputs/apk/release"
          source_apk="$release_dir/app-release.apk"
          release_apk="$release_dir/NyTweetDeck-Android-v${RELEASE_VERSION}.apk"
          cp "$source_apk" "$release_apk"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs "$release_apk"
          (cd "$release_dir" && sha256sum "$(basename "$release_apk")" > "$(basename "$release_apk").sha256")

      - name: Extract release notes from changelog
        shell: pwsh
        run: >-
          ./scripts/verify-release-notes.ps1
          -Version "$env:RELEASE_VERSION"
          -SectionPrefix Android
          -OutputPath target/android-release-notes.md

      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: NyTweetDeck-${{ env.RELEASE_TAG }}
          path: |
            android/app/build/outputs/apk/release/NyTweetDeck-Android-v*.apk
            android/app/build/outputs/apk/release/NyTweetDeck-Android-v*.apk.sha256
          if-no-files-found: error

      - name: Publish tagged GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          apk="android/app/build/outputs/apk/release/NyTweetDeck-Android-v${RELEASE_VERSION}.apk"
          checksum="${apk}.sha256"
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release edit "$RELEASE_TAG" \
              --title "NyTweetDeck Android v${RELEASE_VERSION}" \
              --notes-file target/android-release-notes.md
            gh release upload "$RELEASE_TAG" "$apk" "$checksum" --clobber
          else
            gh release create "$RELEASE_TAG" "$apk" "$checksum" \
              --verify-tag \
              --title "NyTweetDeck Android v${RELEASE_VERSION}" \
              --notes-file target/android-release-notes.md
          fi
