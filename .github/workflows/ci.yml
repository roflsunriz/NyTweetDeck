name: CI

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  android-verify:
    name: Android verify
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          java-package: jdk
          check-latest: false
          cache: gradle

      - name: Install Android SDK 36
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - name: Verify Android application
        working-directory: android
        run: >-
          ./gradlew --no-daemon
          :app:testDebugUnitTest
          :app:lintDebug
          :app:lintRelease
          :app:assembleDebugAndroidTest
          :app:assembleRelease

      - name: Audit Android dependencies
        shell: pwsh
        run: ./scripts/audit-gradle.ps1

  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          java-package: jdk
          check-latest: false
          cache: maven

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0

      - name: Install frontend dependencies
        working-directory: frontend
        run: bun install --frozen-lockfile

      - name: Verify frontend
        working-directory: frontend
        run: |
          bun run lint
          bun run format:check
          bun run type-check
          bun run test

      - name: Verify application
        run: mvn --batch-mode --no-transfer-progress verify

      - name: Verify packaged browser UI
        run: bash ./scripts/verify-ui.sh

      - name: Verify autostart installers
        shell: pwsh
        run: ./scripts/verify-autostart.ps1

      - name: Verify integrated installers
        shell: pwsh
        run: ./scripts/verify-installation.ps1

      - name: Verify local HTTPS domain
        shell: pwsh
        run: ./scripts/verify-local-domain.ps1

      - name: Verify release notes extraction
        shell: pwsh
        run: |
          ./scripts/verify-release-notes.ps1
          ./scripts/verify-release-notes.ps1 -Version 0.2.0 -SectionPrefix Android -OutputPath target/android-release-notes.md

      - name: Audit Maven dependencies
        shell: pwsh
        run: ./scripts/audit-maven.ps1

  jdk-compatibility:
    name: JDK ${{ matrix.distribution }} ${{ matrix.java-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        # setup-java v5が公式対応する非推奨でない全ディストリビューションを固定する。
        distribution:
          - temurin
          - zulu
          - liberica
          - microsoft
          - corretto
          - semeru
          - oracle
          - dragonwell
          - sapmachine
          - graalvm
          - graalvm-community
          - jetbrains
          - kona
        java-version: ["17", "21", "25"]
        exclude:
          # Oracle/GraalVM 17はsetup-java公式README指定のGFTC/NFTC版へ固定する。
          - distribution: oracle
            java-version: "17"
          - distribution: graalvm
            java-version: "17"
        include:
          - distribution: oracle
            java-version: "17.0.12"
          - distribution: graalvm
            java-version: "17.0.12"
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Java
        uses: actions/setup-java@v5
        env:
          # JetBrains resolver reads this environment variable for authenticated GitHub API calls.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          distribution: ${{ matrix.distribution }}
          java-version: ${{ matrix.java-version }}
          java-package: jdk
          check-latest: false
          cache: maven

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0

      - name: Prepare bundled frontend fixture
        working-directory: frontend
        run: |
          bun install --frozen-lockfile
          bun run build

      - name: Verify Java runtime compatibility
        run: >-
          mvn --batch-mode --no-transfer-progress
          -Dexec.skip=true test
